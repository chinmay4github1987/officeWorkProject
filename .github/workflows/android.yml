# Android: run the unit tests, then build the debug and release APKs and keep them as downloads.
#
#   Pull request / push to main -> tests + APKs attached to the run (Actions tab -> run -> Artifacts).
#   Tag v*  (git tag v0.2.0 && git push origin v0.2.0) -> same, plus a GitHub Release with both APKs.
#   Run workflow button -> same as a push.
#
# The APK needs no server: live data comes from https://fakestoreapi.com, and enquiries are posted to a Formspree
# form that emails the sales inbox. The form's ID is read from the repository's Actions variable or secret
# FORMSPREE_FORM_ID (Settings -> Secrets and variables -> Actions). It isn't a password; without it, enquiries show
# "not set up yet". No SMTP or API passwords are ever built into the app.
name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:

# A newer push to the same branch cancels the older, now pointless, build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Strip Windows-specific local java home if present
        run: sed -i '/org.gradle.java.home/d' gradle.properties || true

      # testDebugUnitTest covers the Android modules (including the Robolectric UI tests);
      # core:model is plain Kotlin, so its task is just `test`.
      - name: Unit and UI tests
        run: ./gradlew testDebugUnitTest :core:model:test

      - name: Build APKs
        env:
          # An Actions variable (not secret, it's public in the form's URL) or, if you prefer, a secret.
          FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID || secrets.FORMSPREE_FORM_ID }}
        run: |
          if [ -n "$FORMSPREE_FORM_ID" ]; then
            echo "Enquiries: ON (posted to Formspree form $FORMSPREE_FORM_ID)"
          else
            echo "Enquiries: OFF (add a FORMSPREE_FORM_ID variable to turn them on)"
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Name the APKs after the commit
        id: apk
        run: |
          version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/catalogue-$version-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/catalogue-$version-release.apk"
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-apk-${{ steps.apk.outputs.version }}
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Keep the test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/
          retention-days: 7

  release:
    # Only for version tags, and only after the build (and its tests) passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: catalogue-apk-*
          merge-multiple: true
          path: dist

      - name: Publish a GitHub Release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
