# Android: run the unit tests, then build the debug and release APKs and keep them as downloads.
#
#   Pull request / push to main -> tests + APKs attached to the run (Actions tab -> run -> Artifacts).
#   Tag v*  (git tag v0.2.0 && git push origin v0.2.0) -> same, plus a GitHub Release with both APKs.
#   Run workflow button -> same as a push, and you can point the app at a different backend.
#
# Enquiry email from the app: the APK build reads SMTP_HOST, SMTP_PORT, SMTP_SECURITY, SMTP_USERNAME,
# SMTP_PASSWORD, SMTP_FROM and SALES_INBOX from the repository's Actions secrets (see android/.env.example).
#
# The APK talks to OUR backend, never to Fake Store. Its URL is baked in at build time from
# catalogue.apiBaseUrl (android/gradle.properties). The default, http://10.0.2.2:3000/, only works on an
# emulator whose host machine is running the backend. For a phone, run the workflow by hand and give the
# deployed backend's https:// URL (plain http is only allowed for 10.0.2.2, see network_security_config.xml).
name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL baked into the APK (must end with /). Empty = gradle.properties default (emulator only).'
        required: false
        default: ''

# A newer push to the same branch cancels the older, now pointless, build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Choose the backend URL
        id: api
        env:
          # Passed through env, never pasted into the script, so the input can't inject shell commands.
          INPUT_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -z "$INPUT_URL" ]; then
            echo "Using the default from gradle.properties"
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_URL" =~ ^https?://[A-Za-z0-9.:-]+(/[A-Za-z0-9._~/-]*)?/$ ]]; then
            echo "Using $INPUT_URL"
            echo "args=-Pcatalogue.apiBaseUrl=$INPUT_URL" >> "$GITHUB_OUTPUT"
          else
            echo "::error::api_base_url must look like https://api.example.com/ (and end with /)"
            exit 1
          fi

      # testDebugUnitTest covers the Android modules; core:model is plain Kotlin, so its task is just `test`.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test ${{ steps.api.outputs.args }}

      # SMTP settings for emailing enquiries from the app come from the repository's Actions secrets
      # (Settings -> Secrets and variables -> Actions), the same names as android/.env.example.
      # A missing secret is just empty: with no SMTP_HOST the APK sends enquiries through the backend instead.
      # Warning: the values are built into the APKs, and this repo's artifacts and releases are downloadable.
      - name: Build APKs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SALES_INBOX: ${{ secrets.SALES_INBOX }}
        run: |
          # Empty secrets must not override the build's defaults (an empty SMTP_PORT isn't a number).
          for name in SMTP_HOST SMTP_PORT SMTP_SECURITY SMTP_USERNAME SMTP_PASSWORD SMTP_FROM SALES_INBOX; do
            [ -z "${!name}" ] && unset "$name"
          done
          if [ -n "${SMTP_HOST:-}" ] && [ -n "${SALES_INBOX:-}" ]; then
            # Only says whether each value exists; never prints one.
            password_state="missing"; [ -n "${SMTP_PASSWORD:-}" ] && password_state="present"
            echo "Enquiry email: ON (sent from the app over SMTP; password secret $password_state)"
          else
            echo "Enquiry email: OFF (add SMTP_HOST and SALES_INBOX secrets to turn it on); enquiries go through the backend"
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease ${{ steps.api.outputs.args }}

      - name: Name the APKs after the commit
        id: apk
        run: |
          version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/catalogue-$version-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/catalogue-$version-release.apk"
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-apk-${{ steps.apk.outputs.version }}
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Keep the test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/
          retention-days: 7

  release:
    # Only for version tags, and only after the build (and its tests) passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: catalogue-apk-*
          merge-multiple: true
          path: dist

      - name: Publish a GitHub Release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
