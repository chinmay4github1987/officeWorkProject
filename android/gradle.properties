org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the app finds the backend. 10.0.2.2 is the Android emulator's alias for your computer's localhost.
# Override without editing this file:  ./gradlew installDebug -Pcatalogue.apiBaseUrl=http://192.168.1.20:3000/
catalogue.apiBaseUrl=http://10.0.2.2:3000/

# Product enquiries by email straight from the app (JavaMail for Android): the SMTP settings and password go in
# android/.env (copy .env.example). NEVER put the password in this file: it is committed and the repo is public.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
